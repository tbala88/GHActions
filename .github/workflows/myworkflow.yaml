name: Build and Push Docker Image
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Which component to build?'
        required: true
        default: 'frontend'
        type: choice
        options:
          - frontend
          - backend
          - db
      tag:
        description: 'Image tag (e.g., v1.0.0)'
        required: true
        default: 'latest'
        type: string
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ github.event.inputs.component }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myquotes-${{ github.event.inputs.component }}:${{ github.event.inputs.tag }}
